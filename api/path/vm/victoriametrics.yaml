get:
  summary: Get VM monitor by metricType with victoriametrics
  operationId: getMonitorVMWithVM
  tags:
    - vms
  parameters:
    - name: id
      in: path
      description: vm id
      required: true
      schema:
        type: integer
        format: uint64
    - name: metricType
      in: path
      required: true
      schema:
        $ref: "../../openapi.yaml#/components/schemas/VMMetricType"
    - name: start
      in: query
      required: true
      schema:
        type: integer
        format: int64
    - name: end
      in: query
      required: true
      schema:
        type: integer
        format: int64
    - name: step
      in: query
      required: false
      schema:
        type: integer
        format: int64
  responses:
    "200":
      description: Get VM monitor by metricType
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Monitor"
    "401":
      $ref: "../../openapi.yaml#/components/responses/ErrorResponse401"
    "404":
      $ref: "../../openapi.yaml#/components/responses/ErrorResponse404"
    "403":
      $ref: "../../openapi.yaml#/components/responses/ErrorResponse403"
    "500":
      $ref: "../../openapi.yaml#/components/responses/ErrorResponse500"
