get:
  summary: Get zone detail
  operationId: get
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: uint64
  tags:
    - zones_client
  responses:
    "200":
      description: Get zone detail
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Zone"

    "401":
      $ref: "../../openapi.yaml#/components/responses/ErrorResponse401"
    "404":
      $ref: "../../openapi.yaml#/components/responses/ErrorResponse404"
    "403":
      $ref: "../../openapi.yaml#/components/responses/ErrorResponse403"
    "500":
      $ref: "../../openapi.yaml#/components/responses/ErrorResponse500"

put:
  summary: Update zone
  operationId: update
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: uint64
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../openapi.yaml#/components/schemas/UpdateZoneClientRequest"
  tags:
    - zones_client
  responses:
    "200":
      description: Zone updated successfully
    "401":
      $ref: "../../openapi.yaml#/components/responses/ErrorResponse401"
    "404":
      $ref: "../../openapi.yaml#/components/responses/ErrorResponse404"
    "403":
      $ref: "../../openapi.yaml#/components/responses/ErrorResponse403"
    "500":
      $ref: "../../openapi.yaml#/components/responses/ErrorResponse500"