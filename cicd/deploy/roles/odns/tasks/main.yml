- name: Fetch secrets from Vault
  ansible.builtin.uri:
    url: "{{ VAULT_URL }}/v1/ocn/data/{{ PROJECT }}/{{ APPNAME1 }}"
    method: GET
    headers:
      X-Vault-Token: "{{ VAULT_TOKEN }}"
    validate_certs: false
    return_content: true
    status_code: 200
  register: vault_secret_app1
  delegate_to: localhost

- name: Write config.env
  ansible.builtin.copy:
    dest: "{{ CONFIG_FOLDER_APP1 }}/config.env"
    mode: "0600"
    content: |
      {% for key, value in (vault_secret_app1.json.data.data | default({})).items() %}
      {{ key }}="{{ value }}"
      {% endfor %}

- name: Start and enable odns-api-admin service
  service:
    name: odns-api-admin
    enabled: yes
    state: restarted
  tags: config_gen

- name: Check if odns-api-client exists
  stat: path=/lib/systemd/system/odns-api-client.service
  register: client_stat

- name: Stop client services
  service:
    name: odns-api-client
    state: stopped
  ignore_errors: true
  when: client_stat.stat.exists

- name: Remove client package
  apt:
    name: odns-api-client
    state: absent
    purge: true
  ignore_errors: true

- name: Install odns-api-client
  apt:
    name: odns-api-client={{ VERSION }}
    update_cache: true
    state: present
  register: client_status
  until: client_status is success
  delay: 6
  retries: 10

