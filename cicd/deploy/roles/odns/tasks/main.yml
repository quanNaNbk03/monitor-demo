- name: Add multiple internal DNS entries
  lineinfile:
    path: /etc/hosts
    line: "{{ item }}"
    state: present
    create: yes
  with_items:
    - "172.18.206.2 nexus.ocn.com.vn"
    - "172.18.206.2 vault.ocn.com.vn"


- name: Config authentication nexus
  template:
    src: nexus-ocn.conf.j2
    dest: /etc/apt/auth.conf.d/nexus-ocn.conf
    owner: root
    group: root
    mode: '0600'

- name: Add GPG key
  copy:
    src: ocn-nexus-pubkey.asc
    dest: /etc/apt/trusted.gpg.d/ocn-nexus-pubkey.asc

- name: Disable Verify-Peer https::nexus.ocn.com.vn
  copy:
    src: 99disable-cert-check
    dest: /etc/apt/apt.conf.d/99disable-cert-check

- name: Remove old repo nexus config 
  file:
    path: /etc/apt/sources.list.d/nexus-ocn.list
    state: absent

- name: Add OCN Nexus apt repository
  apt_repository:
    repo: deb [signed-by=/etc/apt/trusted.gpg.d/ocn-nexus-pubkey.asc arch=amd64] https://nexus.ocn.com.vn/repository/ubuntu-jammy/ jammy main
    state: present
    filename: nexus-ocn


- name: Check if odns-api-admin exists
  stat: path=/lib/systemd/system/odns-api-admin.service
  register: service_stat

- name: Stop services
  service:
    name: odns-api-admin
    state: stopped
  ignore_errors: true
  when: service_stat.stat.exists

- name: Remove package
  apt:
    name: odns-api-admin
    state: absent
    purge: true
  ignore_errors: true

- name: Install odns-api-admin
  apt:
    name: odns-api-admin={{ VERSION }}
    update_cache: true
    state: present
  register: apt_status
  until: apt_status is success
  delay: 6
  retries: 10

